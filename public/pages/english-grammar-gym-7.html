<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grammar Gym Year 7</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f3ef; --surface:#ffffff; --ink:#14161b; --ink2:#2b2e36; --muted:#686c75;
  --line:#e2dfd7; --line2:#cdc9be; --soft:#f7f6f2;
  --ok:#157347; --okbg:#e5f3ea; --bad:#b42318; --badbg:#fcebe9;
  --lime:#c5f03c; --sw:#fff6c4; --sw-edge:#e8d36a;
  --accent:#14161b; --accent-soft:#efeee9;
  --hdr:100px;
  --sans:"IBM Plex Sans",system-ui,sans-serif; --display:var(--sans); --mono:var(--sans);
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--sans);font-size:17px;line-height:1.6;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15;letter-spacing:-.015em}
button{font:inherit;cursor:pointer;color:inherit}
.mono{font-family:var(--mono);font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;font-weight:500}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:30;background:var(--ink);color:#f2f1ec}
.hdr-top{display:flex;align-items:center;gap:14px;padding-top:12px;padding-bottom:4px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:1.15rem;text-decoration:none;color:inherit;letter-spacing:-.01em}
.brand .mark{width:12px;height:12px;background:var(--lime);border-radius:2px;transform:rotate(45deg)}
.hdr-top .sp{flex:1}
.overall{display:flex;align-items:center;gap:10px;color:#a8abb3}
.overall .bar{width:110px;height:4px;background:#30333b;border-radius:4px;overflow:hidden}
.overall .bar i{display:block;height:100%;width:0;background:var(--lime);transition:width .4s}
.overall b{color:#fff;font-family:var(--mono);font-size:.8rem;font-weight:500}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:0 8px}
nav.tabs::-webkit-scrollbar{display:none}
.tabs a{white-space:nowrap;padding:10px 10px 11px;color:#a8abb3;text-decoration:none;font-weight:500;font-size:.92rem;border-bottom:3px solid transparent}
.tabs a .n{font-family:var(--mono);font-size:.7rem;color:#6d717a;margin-right:6px}
.tabs a:hover{color:#fff}
.tabs a.on{color:#fff;border-color:var(--lime)}
.tabs a.on .n{color:var(--lime)}

main{padding-bottom:80px}

/* ---------- home ---------- */
.hero{background:var(--ink);color:#f2f1ec;padding:44px 0 60px}
.hero-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:40px;align-items:end}
.hero .mono{color:var(--lime)}
.hero h1{font-size:clamp(2.4rem,7vw,4.2rem);font-weight:800;margin:12px 0 14px;letter-spacing:-.03em}
.hero h1 em{font-style:normal;background:linear-gradient(transparent 62%,rgba(197,240,60,.45) 62%)}
.hero p{color:#b9bcc3;max-width:560px;margin:0;font-size:1.05rem}
.stats{display:grid;grid-template-columns:1fr 1fr;border:1px solid #30333b;border-radius:12px;overflow:hidden}
.stat{padding:16px 18px;border-right:1px solid #30333b}
.stat:last-child{border-right:none}
.stat .v{font-family:var(--display);font-size:2rem;font-weight:700;color:#fff}
.stat .mono{color:#8d9098}
.steps{grid-column:1/-1;display:flex;gap:28px;flex-wrap:wrap;color:#b9bcc3;font-size:.95rem;border-top:1px solid #30333b;padding-top:18px}
.steps span b{font-family:var(--mono);color:var(--lime);font-weight:500;margin-right:6px}
.block-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:40px 0 14px}
.block-title h2{font-size:1.5rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.tcard{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:6px;transition:border-color .15s,transform .15s}
.tcard:hover,.tcard:focus-visible{border-color:var(--c);transform:translateY(-2px)}
.tcard:focus-visible{outline:2px solid var(--c);outline-offset:2px}
.tcard .num{font-family:var(--display);font-size:2.4rem;font-weight:800;color:var(--c);line-height:1}
.tcard h3{font-size:1.25rem;margin-top:6px}
.tcard p{margin:0;color:var(--muted);font-size:.95rem;flex:1}
.tcard .prog{display:flex;align-items:center;gap:10px;margin-top:10px}
.tcard .prog .bar{flex:1;height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.tcard .prog .bar i{display:block;height:100%;background:var(--c)}
.tcard .prog .mono{color:var(--muted)}

/* ---------- topic page ---------- */
.page-head{padding:34px 0 10px}
.page-head .mono{color:var(--accent)}
.page-head h1{font-size:clamp(2rem,6vw,3rem);font-weight:800;margin:8px 0 10px;letter-spacing:-.025em}
.page-head p{margin:0;color:var(--ink2);max-width:680px;font-size:1.05rem}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.tag{border:1px solid var(--line2);border-radius:99px;padding:2px 11px;font-size:.82rem;color:var(--ink2);background:var(--surface)}
.subnav{position:sticky;top:var(--hdr);z-index:10;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:22px;padding:12px 0 10px;margin:18px 0 6px}
.subnav a{color:var(--muted);text-decoration:none;font-weight:600;font-size:.92rem}
.subnav a:hover{color:var(--accent)}
.sec{display:flex;align-items:baseline;gap:14px;margin:34px 0 14px;scroll-margin-top:calc(var(--hdr) + 56px)}
.sec .mono{color:var(--accent)}
.sec h2{font-size:1.55rem}
.legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:.88rem;color:var(--muted);margin:0 0 14px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px;margin-bottom:14px}
.rule{border-left:3px solid var(--accent)}
.rule h3{font-size:1.18rem;margin-bottom:10px}
.rule p{margin:8px 0}
.rule ul{margin:8px 0;padding-left:20px}
.rule li{margin:4px 0}
.form{display:inline-block;font-family:var(--mono);font-size:.86rem;background:var(--accent-soft);border-radius:6px;padding:4px 10px;color:var(--ink);margin:2px 0}
.vf{font-weight:700;border-bottom:2px solid var(--accent);padding-bottom:1px}
.sw{background:var(--sw);box-shadow:inset 0 -2px 0 var(--sw-edge);border-radius:3px;padding:0 4px;font-weight:600;white-space:nowrap;font-style:normal}
.tip,.warn{border-radius:8px;padding:11px 14px;margin:12px 0;font-size:.96rem}
.tip{background:var(--soft);border:1px solid var(--line)}
.warn{background:var(--badbg);border:1px solid #f1c6c1}
.tip b.lbl,.warn b.lbl{font-family:var(--mono);font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;font-weight:500;display:block;margin-bottom:2px;color:var(--muted)}
.warn b.lbl{color:var(--bad)}
.signals{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.tablewrap{overflow-x:auto;margin:10px 0}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;font-weight:500;color:var(--muted);border-bottom:1px solid var(--line2)}
td .eg{display:block;margin-top:5px;font-size:.88rem;color:var(--ink2);font-style:italic}
td .eg::before{content:"e.g. ";font-style:normal;font-family:var(--mono);font-size:.7rem;color:var(--muted)}
table.overview td:first-child{font-weight:700;white-space:nowrap}
table.overview td.f{font-family:var(--mono);font-size:.82rem}
table.overview td .signals{margin:0}

/* timeline */
.timeline{display:grid;grid-template-columns:repeat(3,1fr);position:relative;margin:18px 0 10px;text-align:center;font-size:.95rem}
.timeline::before{content:"";position:absolute;left:0;right:8px;top:10px;height:2px;background:var(--line2)}
.timeline::after{content:"";position:absolute;right:0;top:5px;border:6px solid transparent;border-left:9px solid var(--line2)}
.tl-ev{position:relative;padding:0 4px}
.tl-dot{display:block;width:22px;height:22px;border-radius:50%;margin:0 auto 6px;background:var(--accent);border:4px solid var(--surface);box-shadow:0 0 0 2px var(--accent);position:relative;z-index:1}
.tl-dot.b{background:var(--surface)}
.tl-dot.c{background:var(--line2);box-shadow:0 0 0 2px var(--line2)}
.tl-ev .mono{display:block;color:var(--muted);margin-top:2px}

/* examples */
.examples{padding:4px 22px}
.ex-row{display:flex;gap:14px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
.ex-row:last-child{border-bottom:none}
.ex-row .txt{flex:1}
.ex-row .note{display:block;color:var(--muted);margin-top:3px}
.say{flex:none;width:36px;height:36px;border-radius:50%;border:1px solid var(--line2);background:var(--surface);display:grid;place-items:center;color:var(--ink2)}
.say:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
.say svg{width:16px;height:16px}

/* exercises */
.ex-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.ex-head .mono{color:var(--accent)}
.ex-best{margin-left:auto;color:var(--ok) !important}
.exercise h3{font-size:1.22rem}
.instr{color:var(--muted);margin:4px 0 16px}
.gaptext{line-height:2.6;margin:0}
ol.lines{padding-left:26px;margin:0;line-height:2.6}
ol.lines li::marker{font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.hint{color:var(--muted);font-style:italic;font-size:.92em}
.reveal{display:inline-flex;align-items:center;justify-content:center;min-width:5.5em;min-height:2em;padding:2px 12px;margin:0 2px;border:1px solid var(--line2);border-radius:8px;background:#ecebe6;color:#8a8d94;font-family:var(--mono);font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;vertical-align:middle;line-height:1.2;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.reveal:hover{background:#e3e2dc;color:var(--ink2)}
.reveal.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-family:var(--sans);font-size:1rem;letter-spacing:0;text-transform:none;font-weight:700}
.counter{color:var(--muted);margin-left:auto;align-self:center}
.ex-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.btn{border:1px solid var(--ink);border-radius:8px;padding:9px 18px;font-weight:600;background:var(--ink);color:#fff}
.btn:hover{background:var(--ink2)}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line2)}
.btn.ghost:hover{border-color:var(--ink)}
.result{margin-top:14px;font-weight:600;min-height:1.2em}
.result.good{color:var(--ok)} .result.mid{color:#9a5b00} .result.low{color:var(--bad)}

.mc-item,.ord-item{padding:14px 0;border-bottom:1px solid var(--line)}
.mc-item:last-child,.ord-item:last-child{border-bottom:none}
.q{display:flex;gap:12px;font-weight:600}
.qn{flex:none;font-family:var(--mono);font-size:.78rem;color:var(--muted);width:22px;padding-top:3px}
.blank{display:inline-block;min-width:3.5em;border-bottom:2px solid var(--accent);color:transparent}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0 34px}
.opt{border:1px solid var(--line2);background:var(--surface);border-radius:8px;padding:7px 14px;font-weight:500}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.sel{background:var(--ink);color:#fff;border-color:var(--ink)}
.opt.right{border-color:var(--ok);background:var(--okbg);color:var(--ok);font-weight:600}
.opt.wrong{border-color:var(--bad);background:var(--badbg);color:var(--bad);text-decoration:line-through}
.opt:disabled{cursor:default}
.why{margin:8px 0 0 34px;font-size:.93rem;color:var(--ink2)}
.why:empty{display:none}
.good{color:var(--ok)} .badtxt{color:var(--bad)}
.built{min-height:50px;border:1.5px dashed var(--line2);border-radius:10px;padding:7px;display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 8px 34px;align-items:center;background:var(--soft)}
.built.ok{border-color:var(--ok);background:var(--okbg);border-style:solid}
.built.bad{border-color:var(--bad);background:var(--badbg);border-style:solid}
.built:empty::before{content:"Tap the words in the right order";color:#9a9da4;font-size:.9rem;padding-left:6px}
.pool{display:flex;flex-wrap:wrap;gap:6px;margin-left:34px}
.word{border:1px solid var(--line2);border-radius:8px;padding:6px 12px;font-weight:600;background:var(--surface);box-shadow:0 1px 0 rgba(20,22,27,.08)}
.word:hover{border-color:var(--ink)}
.ord-sol{margin:6px 0 0 34px;font-weight:600;color:var(--ok);font-size:.93rem}
.ord-sol:empty{display:none}
.nextprev{display:flex;justify-content:space-between;gap:12px;margin-top:34px;flex-wrap:wrap}

/* word bank */
.reminders{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-bottom:22px}
.rem{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--soft)}
.rem h4{margin:0;font-family:var(--display);font-size:1.02rem}
.rem .form{font-size:.76rem;margin:4px 0 6px}
.rem p{margin:4px 0 0;font-size:.93rem}
.rem-sw{margin-top:10px;gap:5px}
.rem-sw .sw{font-size:.85rem}
.verb-table td{vertical-align:middle}
.verb-table .reveal{min-width:7.5em}
.filter{font:inherit;width:100%;padding:9px 12px;border-radius:8px;border:1px solid var(--line2);margin:12px 0 4px;background:var(--surface)}
details.card summary{cursor:pointer;font-family:var(--display);font-weight:700;font-size:1.1rem}
.flips{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.flip{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-height:112px;padding:14px;text-align:left;position:relative}
.flip:hover{border-color:var(--ink)}
.flip .front{font-family:var(--display);font-size:1.12rem;font-weight:700}
.flip .back{display:none;font-size:.93rem;margin-top:4px}
.flip .turn{position:absolute;right:12px;bottom:10px;color:var(--muted)}
.flip.on{background:var(--soft)}
.flip.on .front{font-size:.9rem;color:var(--accent)}
.flip.on .back{display:block}
.flip.on .turn{display:none}


@media (max-width:760px){
  body{font-size:16px}
  .hero-grid{grid-template-columns:1fr;gap:24px}
  .overall .lbl,.overall .bar{display:none}
  .opts,.why,.built,.pool,.ord-sol{margin-left:0}
  table.overview,table.overview tbody,table.overview tr,table.overview td{display:block;width:100%}
  table.overview thead{display:none}
  table.overview tr{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:10px}
  table.overview td{border:none;padding:4px 0}
  table.overview td::before{content:attr(data-l);display:block;font-family:var(--mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  table.overview td:first-child::before{display:none}
  table.overview td:first-child{font-family:var(--display);font-size:1.1rem}
}
@media (prefers-reduced-motion:reduce){.tcard{transition:none}}

/* ---------- calm typography: one family, few sizes, no uppercase ---------- */
h1,h2,h3,h4{font-weight:600;letter-spacing:0}
.mono{font-size:.85rem;letter-spacing:0;text-transform:none;font-weight:500}
b,strong{font-weight:600}
.brand{font-weight:600;font-size:1.05rem}
.tabs a{font-size:.9rem}
.tabs a .n{font-size:.9rem}
.hero{padding:36px 0 44px}
.hero h1{font-size:clamp(2rem,5vw,2.6rem);font-weight:600;letter-spacing:-.01em;margin:8px 0 12px}
.hero p,.page-head p{font-size:1rem}
.stat .v{font-size:1.5rem;font-weight:600}
.page-head{padding:28px 0 4px}
.page-head h1{font-size:clamp(1.7rem,4.5vw,2.1rem);font-weight:600;letter-spacing:-.01em;margin:6px 0 8px}
.tags{display:none}
.block-title h2,.sec h2{font-size:1.3rem}
.sec{margin:30px 0 12px}
.sec .mono{display:none}
.tcard .num{font-size:1rem;font-weight:600}
.tcard h3{font-size:1.1rem;margin-top:2px}
.rule h3,.exercise h3{font-size:1.1rem}
.form{font-size:.92rem;font-weight:500}
.vf{font-weight:600;border-bottom:1.5px solid var(--ink2)}
.sw{font-weight:500;box-shadow:none;border-bottom:1.5px solid var(--sw-edge);border-radius:2px}
th{font-size:.85rem;letter-spacing:0;text-transform:none;font-weight:600;color:var(--muted)}
td .eg{font-size:.92rem}
td .eg::before{font-size:.92rem;font-family:var(--sans)}
table.overview td.f{font-size:.92rem}
.tip b.lbl,.warn b.lbl{font-size:.85rem;letter-spacing:0;text-transform:none;font-weight:600}
.ex-row .note{font-size:.85rem}
.ex-head .mono{color:var(--muted)}
.qn{font-size:.85rem}
.reveal{font-size:.85rem;letter-spacing:0;text-transform:none;font-family:var(--sans);font-weight:500}
.reveal.on{background:var(--okbg);border-color:var(--ok);color:var(--ok);font-weight:600;font-size:1rem}
.btn,.opt,.word{font-weight:500}
.score-big{font-size:1.8rem;font-weight:600;letter-spacing:0}
.flip .front{font-size:1.02rem;font-weight:600}
.rem h4{font-size:1rem}
.rem .form{font-size:.85rem}
details.card summary{font-size:1.05rem;font-weight:600}
</style>
</head>
<body>
<header id="hdr">
  <div class="wrap hdr-top">
    <a class="brand" href="#home"><span class="mark"></span>Grammar Gym</a>
    <span class="sp"></span>
    <div class="overall" title="Your overall progress"><span class="mono lbl">Progress</span><span class="bar"><i id="overallBar"></i></span><b id="overallPct">0%</b></div>
  </div>
  <div class="wrap" style="padding:0"><nav class="tabs" id="tabs" aria-label="Topics"></nav></div>
</header>
<main id="app"></main>

<script>
"use strict";
/* ============================================================
   CONTENT
   Gap syntax:  [[hint::answer1;answer2::distractor1;distractor2]]
   Text markup: *verb form*   {signal word}
   No contractions are used in the content (the checker accepts them anyway).
   ============================================================ */
const mc = (q, o, a, why) => ({ q, o, a, why });

const TENSES_OVERVIEW = [
  { name: "Simple past", form: "verb + -ed / 2nd form", use: "finished action at a definite time in the past",
    signals: ["yesterday", "last week", "… ago", "in 2023", "When …?"], more: ["last month", "the other day", "when I was little"], ex: "We *visited* the Tower of London {last year}." },
  { name: "Present perfect", form: "have / has + 3rd form", use: "past action with a link to now: result, experience, still true",
    signals: ["ever", "never", "already", "just", "yet", "so far", "since", "for"], more: ["recently", "up to now", "How long …?", "this week"], ex: "*Have* you {ever} *been* to Scotland?" },
  { name: "Past progressive", form: "was / were + -ing", use: "action in progress at a moment in the past",
    signals: ["while", "at 8 pm yesterday", "when (+ short action)"], more: ["all evening", "at that moment", "as"], ex: "{At 8 pm yesterday} I *was doing* my homework." },
  { name: "Past perfect", form: "had + 3rd form", use: "the past before the past",
    signals: ["already", "by the time", "after", "before", "never … before"], more: ["just", "because", "until"], ex: "{By the time} we arrived, the film *had* {already} *started*." },
  { name: "will-future", form: "will + infinitive", use: "prediction, opinion, spontaneous decision, promise",
    signals: ["I think", "probably", "maybe", "I am sure", "tomorrow"], more: ["perhaps", "I hope", "I expect", "next year", "in the future"], ex: "{I think} it *will rain* {tomorrow}." },
  { name: "going to-future", form: "am / is / are going to + infinitive", use: "plan already made, or a prediction with evidence",
    signals: ["next week", "tonight", "Look!"], more: ["this weekend", "next month", "We have decided …"], ex: "We *are going to visit* Grandma {next weekend}." }
];

const TOPICS = [
/* ---------------------------------------------------------- 1 */
{
  id: "tenses", color: "#a35a00", soft: "#fbf2e4", legend: true,
  title: "Tenses Review",
  short: "Simple past, present perfect, past progressive, will and going to.",
  intro: "Which tense do I need? Look for the signal words and ask: Is it finished? Is it connected to now? Was it in progress? Is it a plan?",
  chips: ["simple past", "present perfect", "past progressive", "will", "going to", "since / for"],
  rules: [
    { h: "All tenses at a glance", body: "%OVERVIEW%" },
    { h: "Simple past: finished, at a definite time", body: `
      <p><span class="form">verb + -ed | irregular: 2nd form</span></p>
      <p>play → played · stop → stopped · study → studied · go → <b>went</b> · see → <b>saw</b></p>

      <ul>
        <li><b>Result now:</b> <i>I *have lost* my key. (I cannot get in now.)</i></li>
        <li><b>Experience:</b> <i>*Have* you {ever} *been* to London?</i></li>
        <li><b>Started in the past and still true:</b> <i>We *have lived* here {since} 2019.</i></li>
      </ul>
      <div class="tip"><b class="lbl">Signal words</b><span class="signals">{ever} {never} {already} {just} {yet} {so far} {recently} {since} {for} {How long …?}</span></div>

    { h: "Past progressive: in progress in the past", body: `

        <li><b>Long action interrupted by a short one:</b> <i>I *was having* a shower {when} the phone rang.</i><br>

{

    { h: "Type 2: unreal, imagined or unlikely", body: `
      <p><span class="form">If + simple past, → would / could / might + infinitive</span></p>
      <p><i>If I *had* a million euros, I *would buy* an island.</i> (I do not have it.)<br>
         <i>If I *were* you, I *would say* sorry.</i> (advice)<br>
         <i>If we *lived* by the sea, we *could go* surfing every day.</i></p>
      <div class="tip"><b class="lbl">Tip</b><b>If I / he / she were …</b> sounds best in tests. (In everyday English people also say <i>was</i>.)</div>

        <tr><td><b>main clause first</b></td><td><b>no comma</b><span class="eg">We will go swimming if it is hot.</span></td></tr>
      </table></div>
      <div class="tablewrap"><table>
        <tr><th></th><th>if-clause</th><th>main clause</th><th>meaning</th></tr>
        <tr><td><b>Type 1</b></td>
            <td>simple present<span class="eg">If it *rains*, …</span></td>
            <td>will + infinitive<span class="eg">… we *will stay* at home.</span></td>

{
  id: "relative", color: "#4a5a70", soft: "#eef1f5",
  title: "Relative Clauses",
  short: "who, which, that, whose, and contact clauses.",
  intro: "A defining relative clause tells us exactly which person or thing we mean. Without it, the sentence would be unclear.",
  chips: ["who", "which", "that", "whose", "where", "contact clauses"],
  rules: [
    { h: "The relative pronouns", body: `
      <div class="tablewrap"><table>
        <tr><th>pronoun</th><th>for</th><th>example</th></tr>
        <tr><td><b>who</b></td><td>people</td><td>The girl *who* sits next to me is from Ireland.</td></tr>
        <tr><td><b>which</b></td><td>things and animals</td><td>The bike *which* I got for my birthday is red.</td></tr>
        <tr><td><b>that</b></td><td>people and things</td><td>The man *that* lives next door is a pilot.</td></tr>
        <tr><td><b>whose</b></td><td>possession (his / her / their)</td><td>That is the boy *whose* bike was stolen.</td></tr>
        <tr><td><b>where</b></td><td>places</td><td>This is the café *where* we met.</td></tr>
      </table></div>
      <div class="tip"><b class="lbl">Tip</b>Defining relative clauses have <b>no commas</b>.</div>` },
    { h: "Contact clauses: leaving out the pronoun", body: `
      <p>You can leave out <b>who / which / that</b> when it is the <b>object</b> of the relative clause:</p>

const app = document.getElementById("app");
function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const pad = n => String(n).padStart(2, "0");
/* *verb form* and {signal word} markup */
function fmt(s) { return s.replace(/\*(.+?)\*/g, '<span class="vf">$1</span>').replace(/\{(.+?)\}/g, '<span class="sw">$1</span>'); }
function plain(s) { return s.replace(/[*{}]/g, "").replace(/<[^>]+>/g, ""); }

function norm(s) {
  return String(s).toLowerCase()
    .replace(/[’‘`´]/g, "'")
    .replace(/[.,!?;:"“”()]/g, " ")
    .replace(/\s*\/\s*/g, "/")
    .replace(/\bwon't\b/g, "will not").replace(/\bcan't\b/g, "cannot").replace(/\bshan't\b/g, "shall not")
    .replace(/n't\b/g, " not").replace(/'ll\b/g, " will").replace(/'ve\b/g, " have").replace(/'re\b/g, " are")
    .replace(/\bi'm\b/g, "i am").replace(/\bcan not\b/g, "cannot")
    .replace(/\s+/g, " ").trim();
}
function variants(s) {
  const n = norm(s), out = new Set([n]);
  if (/'d\b/.test(n)) { out.add(norm(n.replace(/'d\b/g, " would"))); out.add(norm(n.replace(/'d\b/g, " had"))); }
  if (/'s\b/.test(n)) { out.add(norm(n.replace(/'s\b/g, " is"))); out.add(norm(n.replace(/'s\b/g, " has"))); }
  return out;
}
function matches(user, answers) {
  if (!String(user).trim()) return false;
  const uv = variants(user);
  return answers.some(a => [...variants(a)].some(v => uv.has(v)));
}

/* speech (British English voice if available) */
const canSpeak = "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;
const SPEAKER = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>';
function speak(text) {
  if (!canSpeak) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-GB"; u.rate = 0.92;
    const vs = speechSynthesis.getVoices();
    const v = vs.find(v => v.lang && v.lang.replace("_", "-").startsWith("en-GB")) || vs.find(v => v.lang && v.lang.startsWith("en"));
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch (e) {}
}
function sayBtn(text) {
  const b = el("button", "say", SPEAKER); b.type = "button";
  b.title = "Listen"; b.setAttribute("aria-label", "Listen: " + text);
  b.onclick = () => speak(text);
  return b;
}

function resultMsg(box, correct, total) {
  const pct = Math.round(correct / total * 100);
  box.className = "result " + (pct >= 80 ? "good" : pct >= 50 ? "mid" : "low");
  box.textContent = `${correct} / ${total} correct (${pct} %). ` +
    (pct === 100 ? "Perfect!" : pct >= 80 ? "Great job." : pct >= 50 ? "Good start. Look at the red ones and try again." : "Keep training: read the rules again and retry.");
  return pct;
}

/* ============================================================
   GAPS: grey "show" buttons. Think of the answer, then tap to check.
   (Distractors after the second :: in the data are not used.)
   ============================================================ */
function parseGaps(str, gaps) {
  return str.replace(/\[\[(.*?)::(.*?)(?:::(.*?))?\]\]/g, (m, hint, ans) => {
    const i = gaps.length, answer = ans.split(";")[0];
    gaps.push(answer);
    return (hint ? `<span class="hint">(${hint})</span> ` : "") +
      `<button type="button" class="reveal" data-a="${answer.replace(/"/g, "&quot;")}" aria-label="Show answer ${i + 1}">show</button>`;
  });
}
function toggleReveal(b, on) {
  on = on ?? !b.classList.contains("on");
  b.classList.toggle("on", on);
  b.textContent = on ? b.dataset.a : "show";
}

  const update = () => {
    const n = btns().filter(b => b.classList.contains("on")).length;
    counter.textContent = `${n} / ${gaps.length} checked`;
    if (n === gaps.length) { setBest(id, 100); card._showBest(); }
  };
  body.addEventListener("click", e => { const b = e.target.closest(".reveal"); if (b) { toggleReveal(b); update(); } });
  const bAll = el("button", "btn ghost", "Show all"), bHide = el("button", "btn ghost", "Hide all");
  bAll.onclick = () => { btns().forEach(b => toggleReveal(b, true)); update(); };
  bHide.onclick = () => { btns().forEach(b => toggleReveal(b, false)); update(); };
  actions.append(bAll, bHide, counter);
  update();
}

function mcItem(item, num, opts) {
  const w = el("div", "mc-item");
  w.innerHTML = `<div class="q"><span class="qn">${pad(num)}</span><span>${item.q.replace(/___/g, '<span class="blank">___</span>')}</span></div><div class="opts"></div><div class="why"></div>`;
  const box = w.querySelector(".opts"), why = w.querySelector(".why");
  const correct = new Set([].concat(item.a));
  const order = opts.fixed ? item.o.map((_, i) => i) : shuffle(item.o.map((_, i) => i));
  order.forEach(oi => { const b = el("button", "opt", item.o[oi]); b.type = "button"; b.dataset.oi = oi; box.append(b); });
  let chosen = null, locked = false;
  const reveal = () => {
    locked = true;
    box.querySelectorAll(".opt").forEach(b => {
      const oi = +b.dataset.oi; b.disabled = true; b.classList.remove("sel");
      if (correct.has(oi)) b.classList.add("right"); else if (oi === chosen) b.classList.add("wrong");
    });
    const ok = correct.has(chosen);
    why.innerHTML = (ok ? '<b class="good">Correct.</b> ' : '<b class="badtxt">Not quite.</b> ') + (item.why || "");
    return ok;
  };
  box.addEventListener("click", e => {
    const b = e.target.closest(".opt"); if (!b || locked) return;
    chosen = +b.dataset.oi;
    if (opts.test) { box.querySelectorAll(".opt").forEach(x => x.classList.toggle("sel", x === b)); return; }
    opts.onAnswer(reveal());
  });
  w.grade = reveal;
  return w;
}
function renderMCEx(card, ex, id) {
  const body = card.querySelector(".ex-body"), actions = card.querySelector(".ex-actions"), res = card.querySelector(".result");
  const build = () => {
    body.innerHTML = ""; res.textContent = ""; res.className = "result";
    let answered = 0, right = 0;
    ex.items.forEach((it, k) => body.append(mcItem(it, k + 1, {
      fixed: ex.fixed,
      onAnswer: ok => { answered++; if (ok) right++; if (answered === ex.items.length) { setBest(id, resultMsg(res, right, ex.items.length)); card._showBest(); } }
    })));
  };
  const bReset = el("button", "btn ghost", "Try again"); bReset.onclick = build;
  actions.append(bReset);
  build();
}

function orderItem(item, num) {
  const w = el("div", "ord-item");
  const tokens = item.a.replace(/[.,!?]/g, "").split(/\s+/);
  if (!item.keepFirst && tokens[0] !== "I") tokens[0] = tokens[0].charAt(0).toLowerCase() + tokens[0].slice(1);
  let mixed = shuffle(tokens.map((t, i) => ({ t, i })));
  if (mixed.every((x, k) => x.i === k)) mixed = mixed.reverse();
  w.innerHTML = `<div class="q"><span class="qn">${pad(num)}</span><span>Put the words in order.</span></div><div class="built"></div><div class="pool"></div><div class="ord-sol"></div>`;
  const built = w.querySelector(".built"), pool = w.querySelector(".pool"), sol = w.querySelector(".ord-sol");
  mixed.forEach(x => { const b = el("button", "word", x.t); b.type = "button"; pool.append(b); });
  w.addEventListener("click", e => {
    const b = e.target.closest(".word"); if (!b) return;
    built.classList.remove("ok", "bad"); sol.textContent = "";
    (b.parentElement === pool ? built : pool).append(b);
  });
  w.grade = () => {
    const said = [...built.querySelectorAll(".word")].map(b => b.textContent).join(" ");
    const ok = pool.children.length === 0 && matches(said, [item.a, ...(item.alt || [])]);
    built.classList.toggle("ok", ok); built.classList.toggle("bad", !ok);
    sol.textContent = ok ? "" : "→ " + item.a;
    return ok;
  };
  return w;
}
function renderOrderEx(card, ex, id) {
  const body = card.querySelector(".ex-body"), actions = card.querySelector(".ex-actions"), res = card.querySelector(".result");
  let items = [];
  const build = () => { body.innerHTML = ""; res.textContent = ""; res.className = "result"; items = ex.items.map((it, k) => { const w = orderItem(it, k + 1); body.append(w); return w; }); };
  const bCheck = el("button", "btn", "Check"), bReset = el("button", "btn ghost", "Try again");
  bCheck.onclick = () => { const ok = items.filter(w => w.grade()).length; setBest(id, resultMsg(res, ok, items.length)); card._showBest(); };
  bReset.onclick = build;
  actions.append(bCheck, bReset);
  build();
}

function viewTopic(t) {
  setAccent(t.color, t.soft);
  const idx = TOPICS.indexOf(t);
  app.innerHTML = "";
  const w = el("div", "wrap"); app.append(w);
  w.append(el("div", "page-head", `<span class="mono">Topic ${idx + 1} of ${TOPICS.length}</span><h1>${t.title}</h1><p>${t.intro}</p>
    <div class="tags">${t.chips.map(c => `<span class="tag">${c}</span>`).join("")}</div>`));
  const sub = el("nav", "subnav", `<a href="#" data-to="rules">Rules</a><a href="#" data-to="examples">Examples</a><a href="#" data-to="practice">Practice</a>`);
  sub.addEventListener("click", e => { const a = e.target.closest("a"); if (!a) return; e.preventDefault(); document.getElementById(a.dataset.to).scrollIntoView({ behavior: "smooth" }); });
  w.append(sub);

  const sec = (id, n, title) => { const h = el("div", "sec", `<span class="mono">${n}</span><h2>${title}</h2>`); h.id = id; w.append(h); };
  sec("rules", "A", "Rules");
  if (t.legend) w.append(el("div", null, legendHtml()));
  t.rules.forEach(r => w.append(el("div", "card rule", `<h3>${r.h}</h3>${r.body === "%OVERVIEW%" ? overviewHtml() : fmt(r.body)}`)));

  sec("examples", "B", "Examples");
  const box = el("div", "card examples");
  t.examples.forEach(x => {
    const row = el("div", "ex-row", `<span class="txt">${fmt(x.t)}<span class="mono note">${x.n}</span></span>`);
    if (canSpeak) row.append(sayBtn(plain(x.t)));
    box.append(row);
  });
  w.append(box);

  sec("practice", "C", "Practice");
  t.exercises.forEach((ex, i) => {
    const id = `${t.id}-${i}`, card = exerciseCard(i + 1, ex, id);
    w.append(card);
    if (ex.type === "gap") renderGapEx(card, ex, id);
    else if (ex.type === "mc") renderMCEx(card, ex, id);
    else if (ex.type === "order") renderOrderEx(card, ex, id);
  });

  const np = el("div", "nextprev");
  if (idx > 0) { const b = el("button", "btn ghost", `← ${TOPICS[idx - 1].title}`); b.onclick = () => go(TOPICS[idx - 1].id); np.append(b); } else np.append(el("span"));
  const nx = idx < TOPICS.length - 1 ? TOPICS[idx + 1] : null;
  const b = el("button", "btn", nx ? `Next: ${nx.title} →` : "Word Bank →"); b.onclick = () => go(nx ? nx.id : "words"); np.append(b);
  w.append(np);
}

function viewWords() {
  setAccent("#2f7d32", "#eaf4ea");
  app.innerHTML = "";
  const w = el("div", "wrap"); app.append(w);
  w.append(el("div", "page-head", `<span class="mono">Extra training</span><h1>Word Bank</h1><p>Irregular verbs, signal words and the most important grammar words.</p>`));
  const sec = (n, title) => w.append(el("div", "sec", `<span class="mono">${n}</span><h2>${title}</h2>`));

  /* irregular verbs trainer: think, then tap to check */
  sec("A", "Irregular verbs trainer");
  const card = el("section", "card exercise");
  card.innerHTML = `<p class="instr">You need the 2nd form for the simple past and the 3rd form for the present perfect and past perfect. Say both forms in your head, then tap “show” to check.</p>
    <div class="tablewrap"><table class="verb-table"><thead><tr><th>infinitive</th><th>simple past (2nd)</th><th>past participle (3rd)</th></tr></thead><tbody></tbody></table></div>
    <div class="ex-actions"></div>`;
  w.append(card);
  const tbody = card.querySelector("tbody");
  const rv = f => `<button type="button" class="reveal" data-a="${f}">show</button>`;
  const vBuild = () => { tbody.innerHTML = shuffle(VERBS).slice(0, 8).map(v => `<tr><td><b>${v[0]}</b></td><td>${rv(v[1])}</td><td>${rv(v[2])}</td></tr>`).join(""); };
  tbody.addEventListener("click", e => { const b = e.target.closest(".reveal"); if (b) toggleReveal(b); });
  const bA = el("button", "btn ghost", "Show all"), bN = el("button", "btn", "New verbs");
  bA.onclick = () => tbody.querySelectorAll(".reveal").forEach(b => toggleReveal(b, true));
  bN.onclick = vBuild;
  card.querySelector(".ex-actions").append(bN, bA);
  vBuild();

  const det = el("details", "card");
  det.innerHTML = `<summary>Full list of irregular verbs (${VERBS.length})</summary><input class="filter" placeholder="Search a verb" aria-label="Search a verb">
    <div class="tablewrap"><table class="verb-table"><thead><tr><th>infinitive</th><th>simple past</th><th>past participle</th><th></th></tr></thead><tbody></tbody></table></div>`;
  w.append(det);
  const tb = det.querySelector("tbody");
  VERBS.forEach(v => {
    const tr = el("tr", null, `<td><b>${v[0]}</b></td><td>${v[1]}</td><td>${v[2]}</td><td></td>`);
    if (canSpeak) tr.lastChild.append(sayBtn(`${v[0]}, ${v[1].replace(" / ", " or ")}, ${v[2].replace(" / ", " or ")}`));
    tr.dataset.s = v.join(" ");
    tb.append(tr);
  });
  det.querySelector(".filter").addEventListener("input", e => {
    const q = e.target.value.trim().toLowerCase();
    tb.querySelectorAll("tr").forEach(tr => { tr.style.display = !q || tr.dataset.s.includes(q) ? "" : "none"; });
  });

  /* signal words */
  sec("B", "Signal words game");
  const sc = el("section", "card exercise");
  sc.innerHTML = `<h3>First, a quick reminder</h3><p class="instr">An example for each tense, and its signal words.</p>${legendHtml()}
    <div class="reminders">${TENSES_OVERVIEW.map(t => `<div class="rem"><h4>${t.name}</h4><p><i>${fmt(t.ex)}</i></p><div class="signals rem-sw">${[...t.signals, ...(t.more || [])].map(x => `<span class="sw">${x}</span>`).join(" ")}</div></div>`).join("")}</div>
    <h3>Now you: which tense is it?</h3><p class="instr">Read the sentence and look at the underlined verb. Which tense is it? Tip: look for signal words.</p>
    <div class="ex-body"></div><div class="ex-actions"></div><div class="result" aria-live="polite"></div>`;
  w.append(sc);
  const sBody = sc.querySelector(".ex-body"), sRes = sc.querySelector(".result");
  const sBuild = () => {
    sBody.innerHTML = ""; sRes.textContent = ""; sRes.className = "result";
    const items = shuffle(TENSE_SENTENCES);
    let answered = 0, right = 0;
    items.forEach((s, k) => sBody.append(mcItem({ q: fmt(s[0]), o: SIGNAL_OPTS, a: s[1], why: s[2] }, k + 1, {
      fixed: true, onAnswer: ok => { answered++; if (ok) right++; if (answered === items.length) resultMsg(sRes, right, items.length); }
    })));
  };
  const sR = el("button", "btn ghost", "Try again"); sR.onclick = sBuild; sc.querySelector(".ex-actions").append(sR);
  sBuild();

  /* glossary */
  sec("C", "Grammar words");
  w.append(el("p", "instr", "Tap a card to see what the word means."));
  const flips = el("div", "flips");
  GLOSSARY.forEach(([term, def]) => {
    const b = el("button", "flip", `<div class="front">${term}</div><div class="back">${def}</div><span class="mono turn">tap</span>`);
    b.type = "button"; b.onclick = () => b.classList.toggle("on"); flips.append(b);
  });
  w.append(flips);
}

tabs.innerHTML = `<a href="#home" data-id="home">Home</a>` +
  TOPICS.map((t, i) => `<a href="#${t.id}" data-id="${t.id}">${t.title}</a>`).join("") +
  `<a href="#words" data-id="words">Word Bank</a>`;

window.addEventListener("resize", setHdr);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(setHdr);

function go(id) { location.hash = id; }
function route() {
  const id = location.hash.slice(1) || "home";
  const t = TOPICS.find(x => x.id === id);
  if (t) viewTopic(t); else if (id === "words") viewWords(); else viewHome();
  const active = (t || id === "words") ? id : "home";
  tabs.querySelectorAll("a").forEach(a => {
    const on = a.dataset.id === active;
    a.classList.toggle("on", on);
    if (on) tabs.scrollLeft = Math.max(0, a.offsetLeft - 40);
  });
  updateOverall(); setHdr();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
if (canSpeak) { try { speechSynthesis.getVoices(); } catch (e) {} }
route();
