<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Wie KI denkt · How AI thinks</title>
  <meta name="description" content="Scrollytelling-Flug in ein Sprachmodell: Tokens, Embeddings, Attention, Schichten und Softmax.">
  <meta name="color-scheme" content="dark">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Syne:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="style.css">
  <script>
    // Decide motion mode before first paint (no flash of the wrong layout).
    (function () {
      var pref = null;
      try { pref = localStorage.getItem("aix-motion"); } catch (e) {}
      var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (pref === "off" || (reduce && pref !== "force")) document.documentElement.classList.add("static");
      document.documentElement.classList.add("js");
    })();
  </script>
</head>
<body>
  <header class="topbar">
    <a class="back" href="/" data-i18n="ui.back">← Lernhub</a>
    <span class="brand" data-i18n="ui.brand">Wie KI denkt</span>
    <div class="tb-right">
      <button type="button" class="pill" id="motionBtn"></button>
      <div class="seg" role="group" data-i18n-attr="aria-label:ui.lang">
        <button type="button" data-lang="de">DE</button>
        <button type="button" data-lang="en">EN</button>
      </div>
    </div>
    <div class="progress" aria-hidden="true"><span id="progressBar"></span></div>
  </header>

  <nav class="chapters" id="chapters" data-i18n-attr="aria-label:ui.chapters"></nav>

  <noscript><p class="noscript">Diese Seite braucht JavaScript. · This page needs JavaScript.</p></noscript>

  <!-- One continuous world: environments + flying decoration + stations along the z axis -->
  <div id="world">
    <div id="envs" aria-hidden="true"></div>
    <div id="deco" aria-hidden="true"></div>
    <div class="wa" id="worldArea" aria-hidden="true"></div>

    <!-- 00 QUESTION -->
    <section class="station" data-station="intro" aria-labelledby="h-intro">
      <div class="wa world"><div class="world-inner">
        <div class="chatwin">
          <div class="chat-bar"><i></i><i></i><i></i><span data-i18n="intro.app"></span></div>
          <div class="chat-body" id="introBody">
            <div class="sys-card" id="sysCard" data-i18n="intro.sys"></div>
            <div class="msg user"><span id="introTyped"></span><span class="caret"></span></div>
          </div>
          <div class="chat-input"><span data-i18n="intro.input"></span><kbd id="enterKey">Enter ⏎</kbd></div>
        </div>
      </div></div>
      <div class="copy">
        <p class="kicker" data-i18n="intro.kicker"></p>
        <h1 class="headline" id="h-intro" data-i18n="intro.title" data-split></h1>
        <div class="steps" data-steps="intro.steps"></div>
      </div>
    </section>

    <!-- 01 LLM BOX -->
    <section class="station" data-station="llm" aria-labelledby="h-llm">
      <div class="wa world"><div class="world-inner">
        <div class="llmbox">
          <div class="llm-face">
            <div class="llm-portal" aria-hidden="true"></div>
            <b>LLM</b><small data-i18n="llm.params"></small>
          </div>
          <p class="llm-msg" id="llmMsg" data-i18n="prompt"></p>
        </div>
      </div></div>
      <div class="copy">
        <p class="kicker" data-i18n="llm.kicker"></p>
        <h2 class="headline" id="h-llm" data-i18n="llm.title" data-split></h2>
        <div class="steps" data-steps="llm.steps"></div>
      </div>
    </section>

    <!-- 02 TOKENS -->
    <section class="station" data-station="tokens" aria-labelledby="h-tokens">
      <div class="wa world"><div class="world-inner">
        <div class="tok-row" id="tokRow"></div>
      </div></div>
      <div class="copy">
        <p class="kicker" data-i18n="tokens.kicker"></p>
        <h2 class="headline" id="h-tokens" data-i18n="tokens.title" data-split></h2>
        <div class="steps" data-steps="tokens.steps"></div>
      </div>
    </section>

    <!-- 03 EMBEDDING MATRIX -->
    <section class="station" data-station="embed" aria-labelledby="h-embed">
      <div class="wa world"><div class="world-inner">
        <div class="emb">
          <div class="emb-col">
            <p class="emb-h"><span data-i18n="embed.table"></span> · <span data-i18n="embed.rows"></span></p>
            <p class="emb-cur" id="emCur"></p>
            <div class="emb-window" id="emWindow" aria-hidden="true"></div>
          </div>
          <div class="emb-col">
            <p class="emb-h" data-i18n="embed.stack"></p>
            <div class="emb-stack" id="emStack" aria-hidden="true"></div>
            <p class="emb-more" id="emMore"></p>
          </div>
        </div>
      </div></div>
      <div class="copy">
        <p class="kicker" data-i18n="embed.kicker"></p>
        <h2 class="headline" id="h-embed" data-i18n="embed.title" data-split></h2>
        <div class="steps" data-steps="embed.steps"></div>
      </div>
    </section>

    <!-- 04 MEANING SPACE -->
    <section class="station" data-station="space" aria-labelledby="h-space">
      <div class="wa world"><div class="world-inner">
        <div class="emb-space">
          <canvas id="embCanvas" role="img" aria-label="3D embedding space"></canvas>
          <p class="emb-hint" data-i18n="space.hint"></p>
          <ul class="emb-legend" id="embLegend"></ul>
        </div>
      </div></div>
      <div class="copy">
        <p class="kicker" data-i18n="space.kicker"></p>
        <h2 class="headline" id="h-space" data-i18n="space.title" data-split></h2>
        <div class="steps" data-steps="space.steps"></div>
      </div>
    </section>

    <!-- 05 ATTENTION -->
    <section class="station" data-station="attention" aria-labelledby="h-attention">
      <div class="wa world"><div class="world-inner">
        <div class="att">
          <div class="att-heads" id="attHeads" role="group"></div>
          <div class="att-arcs">
            <svg id="attArcs" aria-hidden="true"></svg>
            <div class="att-tokens" id="attTokens" role="group"></div>
          </div>
          <div class="att-matrix-wrap">
            <span class="att-axis ax-cols" data-i18n="attention.colsLabel"></span>
            <div class="att-matrix" id="attMatrix"></div>
            <span class="att-axis ax-rows" data-i18n="attention.rowsLabel"></span>
          </div>
          <p class="note att-note" data-i18n="attention.note"></p>
        </div>
      </div></div>
      <div class="copy">
        <p class="kicker" data-i18n="attention.kicker"></p>
        <h2 class="headline" id="h-attention" data-i18n="attention.title" data-split></h2>
        <div class="steps" data-steps="attention.steps"></div>
      </div>
    </section>

    <!-- 06 LAYERS -->
    <section class="station" data-station="layers" aria-labelledby="h-layers">
      <div class="wa world"><div class="world-inner">
        <div class="tunnel">
          <div class="tun-cam" id="tunCam"></div>
          <div class="tun-hud"><span data-i18n="layers.layer"></span> <b id="layerNo">1</b> / 96</div>
        </div>
      </div></div>
      <div class="copy">
        <p class="kicker" data-i18n="layers.kicker"></p>
        <h2 class="headline" id="h-layers" data-i18n="layers.title" data-split></h2>
        <div class="steps" data-steps="layers.steps"></div>
      </div>
    </section>

    <!-- 07 SOFTMAX -->
    <section class="station" data-station="softmax" aria-labelledby="h-softmax">
      <div class="wa world"><div class="world-inner">
        <div class="smx">
          <div class="smx-a">
            <p class="emb-h" data-i18n="softmax.vectors"></p>
            <div class="smx-vecs" id="smxVecs"></div>
            <p class="smx-unembed"><span class="arrow">↓</span> <span data-i18n="softmax.unembed"></span></p>
          </div>
          <div class="smx-b">
            <p class="smx-sentence"><span data-i18n="softmax.prefix"></span><span class="smx-slot" id="smxSlot" aria-live="polite">▁</span></p>
            <div class="smx-head"><span data-i18n="softmax.logits" class="h-logit"></span><span data-i18n="softmax.probs" class="h-prob"></span></div>
            <div class="smx-bars" id="smxBars"></div>
            <div class="smx-ctrl">
              <label class="smx-temp"><span data-i18n="softmax.temp"></span> T = <output id="tOut">1.00</output>
                <input type="range" id="tRange" min="0.1" max="2" step="0.05" value="1"></label>
              <button type="button" class="btn" id="sampleBtn" data-i18n="softmax.sample"></button>
              <button type="button" class="btn ghost" id="resetBtn" data-i18n="softmax.reset"></button>
            </div>
            <p class="smx-drawn"><span data-i18n="softmax.drawn"></span> <span id="smxDrawn"></span></p>
            <p class="formula smx-formula">p<sub>i</sub> = e<sup>z<sub>i</sub>/T</sup> / Σ<sub>j</sub> e<sup>z<sub>j</sub>/T</sup></p>
          </div>
        </div>
      </div></div>
      <div class="copy">
        <p class="kicker" data-i18n="softmax.kicker"></p>
        <h2 class="headline" id="h-softmax" data-i18n="softmax.title" data-split></h2>
        <div class="steps" data-steps="softmax.steps"></div>
      </div>
    </section>

    <!-- 08 FAST FORWARD -->
    <section class="station" data-station="loop" aria-labelledby="h-loop">
      <div class="wa world"><div class="world-inner">
        <div class="ff">
          <div class="ff-pipe" id="ffPipe">
            <div class="ff-stage"><span class="ff-tok" id="ffTok">?</span><small data-i18n="loop.stages.0"></small></div>
            <div class="ff-stage"><span class="ff-vec" id="ffVec"></span><small data-i18n="loop.stages.1"></small></div>
            <div class="ff-stage"><span class="ff-layers"><i></i><i></i><i></i><i></i></span><small data-i18n="loop.stages.2"></small></div>
            <div class="ff-stage"><span class="ff-bars" id="ffBars"></span><small data-i18n="loop.stages.3"></small></div>
            <div class="ff-stage ff-out"><span class="ff-tok" id="ffOut"></span></div>
          </div>
          <div class="ff-answer"><small data-i18n="loop.answerLabel"></small><p id="ffAnswer"></p></div>
        </div>
      </div></div>
      <div class="copy">
        <p class="kicker" data-i18n="loop.kicker"></p>
        <h2 class="headline" id="h-loop" data-i18n="loop.title" data-split></h2>
        <div class="steps" data-steps="loop.steps"></div>
      </div>
    </section>

    <!-- 09 ANSWER -->
    <section class="station" data-station="outro" aria-labelledby="h-outro">
      <div class="wa world"><div class="world-inner">
        <div class="chatwin">
          <div class="chat-bar"><i></i><i></i><i></i><span data-i18n="intro.app"></span></div>
          <div class="chat-body col">
            <div class="msg user small" data-i18n="prompt"></div>
            <div class="msg bot"><span id="answerText"></span></div>
          </div>
        </div>
      </div></div>
      <div class="copy">
        <p class="kicker" data-i18n="outro.kicker"></p>
        <h2 class="headline" id="h-outro" data-i18n="outro.title" data-split></h2>
        <div class="steps" data-steps="outro.steps"></div>
        <div class="outro-extra">
          <p class="actions"><button type="button" class="btn" id="againBtn" data-i18n="outro.again"></button> <a class="btn ghost" href="/" data-i18n="ui.back"></a></p>
          <details class="sources"><summary data-i18n="outro.sources"></summary>
            <ul id="srcList"></ul>
            <p class="note" data-i18n="outro.disclaimer"></p>
          </details>
        </div>
      </div>
    </section>
  </div>

  <p class="scroll-cue" id="scrollCue" aria-hidden="true"><i></i><i></i><i></i><span data-i18n="ui.scroll"></span></p>

  <!-- Scroll track: empty height that drives the flight (built by engine.js) -->
  <div id="track" aria-hidden="true"></div>

  <script src="vendor/gsap.min.js"></script>
  <script src="vendor/ScrollTrigger.min.js"></script>
  <script src="scenes.js"></script>
  <script src="content.js"></script>
  <script src="model-data.js"></script>
  <script src="widgets.js"></script>
  <script src="story.js"></script>
  <script src="engine.js"></script>
</body>
</html>
